name: Calibration AutoLab
on:
  schedule:
    - cron: "0 3 * * *"   # 3 AM UTC nightly
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  calibrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run calibration tests
        run: uv run pytest tests/test_calibration.py -v

      - name: Lint
        run: uv run ruff check app tests

      - name: Update STATE.md on success
        if: success()
        run: |
          DATE=$(date +%Y-%m-%d)
          cd ..
          # Replace the "pending first run" placeholder with today's date + pass
          sed -i "s/| pending first run/| ${DATE} pass/" STATE.md || true
          git config user.email "autolab@alphaedge.local"
          git config user.name "AutoLab Bot"
          git add STATE.md
          git diff --cached --quiet || git commit -m "chore: calibration autolab run ${DATE} — pass"
          git push || true
