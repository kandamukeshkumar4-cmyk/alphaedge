name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public backend API URL to bake into the static frontend"
        required: true
        # Canonical backend = Hugging Face Space (see deploy-hf-space.yml and
        # frontend/src/lib/alphaedge-api.ts). The old Koyeb URL is retired/dead.
        default: "https://mukeshkumar007-alphaedge-api.hf.space"
  push:
    branches:
      - codex/alphaedge-base
  # pull_request trigger removed 2026-07-30: the SWA static-export build has
  # been red on every PR since the /api/v1/signals/dashboard server proxy
  # route landed (server routes cannot exist in `output: export`), and the
  # deploy target (HF Space backend) is retired — production is
  # Vercel + Railway. Push + manual dispatch remain for the legacy target.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || secrets.NEXT_PUBLIC_API_URL }}
          # Oryx runs plain `npm run build`; static export is opt-in, so force
          # it here — the SWA deploy needs the `out/` artifact folder.
          STATIC_EXPORT: "1"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_MEADOW_01B42B810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "frontend" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "out" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_MEADOW_01B42B810 }}
          action: "close"
