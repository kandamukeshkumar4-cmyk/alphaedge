name: Deploy Backend to Railway

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public Railway API URL (leave blank on first deploy, then set it once the domain exists)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-railway-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy FastAPI backend
        shell: pwsh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_SYNC: ${{ secrets.NEON_DATABASE_URL_SYNC }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          ./scripts/deploy_railway.ps1 -ApiUrl "${{ inputs.api_url }}"

      - name: Verify backend health
        if: ${{ inputs.api_url != '' }}
        run: |
          for i in {1..20}; do
            if curl --fail --show-error --silent "${{ inputs.api_url }}/health"; then
              exit 0
            fi
            echo "Backend not healthy yet; retry $i/20"
            sleep 15
          done
          exit 1

      - name: Setup uv
        if: ${{ inputs.api_url != '' }}
        uses: astral-sh/setup-uv@v6

      - name: Run deploy smoke tests
        if: ${{ inputs.api_url != '' }}
        env:
          RAILWAY_PUBLIC_URL: ${{ inputs.api_url }}
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run --extra dev pytest tests/smoke/ -q --base-url="${RAILWAY_PUBLIC_URL}"

      - name: Rebuild Azure Static Web Apps frontend with backend URL
        if: ${{ inputs.api_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run azure-static-web-apps-proud-meadow-01b42b810.yml \
            --ref "${{ github.ref_name }}" \
            --field api_url=${{ inputs.api_url }}
