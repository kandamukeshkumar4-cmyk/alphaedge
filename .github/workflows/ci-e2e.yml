name: CI E2E

on:
  push:
    branches:
      - loop3-agent-memory
      - codex/alphaedge-base
  pull_request:
    branches:
      - loop3-agent-memory
      - codex/alphaedge-base

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    name: Local-stack Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build frontend for the local API
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18017
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:18017
      - name: Start isolated SQLite, API, and frontend
        shell: bash
        run: |
          set -euo pipefail
          db_path="$RUNNER_TEMP/alphaedge-e2e.sqlite3"
          rm -f "$db_path"
          export PAPER_TRADING_ONLY=true
          export ADMIN_API_KEY=dev-admin-key
          export JWT_SECRET_KEY=ci-e2e-jwt-secret
          export DATABASE_URL="sqlite+aiosqlite:///${db_path}"
          export DATABASE_URL_SYNC="sqlite:///${db_path}"
          export REDIS_URL=redis://disabled
          export APP_ENV=development
          export CORS_ORIGINS=http://127.0.0.1:31017
          export LIVE_FEED_ENABLED=false
          export SCHEDULER_NEWS_SCAN_ENABLED=false
          export SCHEDULER_NEWS_MISPRICING_ENABLED=false
          export SCHEDULER_UNUSUAL_FLOW_ENABLED=false
          export SCHEDULER_WEATHER_SCAN_ENABLED=false
          export SCHEDULER_MORNING_RESEARCH_ENABLED=false
          export SCHEDULER_WHALE_REFRESH_ENABLED=false
          export SCHEDULER_WC2026_RESOLVE_ENABLED=false
          export SCHEDULER_EXTERNAL_RESOLVE_ENABLED=false
          export SCHEDULER_EXTERNAL_AUTOLOCK_ENABLED=false
          export SCHEDULER_DRIFT_DETECT_ENABLED=false
          export SCHEDULER_OPS_ALERTS_ENABLED=false
          export SCHEDULER_PORTFOLIO_EQUITY_ENABLED=false
          export SCHEDULER_DAILY_DIGEST_ENABLED=false
          (cd backend && uv run --extra dev python ../frontend/e2e/helpers/init_sqlite_db.py)
          (cd backend && uv run --extra dev uvicorn app.main:app --host 127.0.0.1 --port 18017 --log-level warning > "$RUNNER_TEMP/alphaedge-api.log" 2>&1 & echo $! > "$RUNNER_TEMP/alphaedge-api.pid")
          (cd frontend && NEXT_PUBLIC_API_URL=http://127.0.0.1:18017 NEXT_PUBLIC_WS_URL=ws://127.0.0.1:18017 npm run start -- --hostname 127.0.0.1 --port 31017 > "$RUNNER_TEMP/alphaedge-frontend.log" 2>&1 & echo $! > "$RUNNER_TEMP/alphaedge-frontend.pid")
          for url in http://127.0.0.1:18017/health http://127.0.0.1:31017; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $url" >&2
                exit 1
              fi
              sleep 2
            done
          done
      - name: Run Chromium Playwright
        run: npx playwright test --project=chromium --retries=1 --reporter=list,html
        working-directory: frontend
        env:
          CI: "true"
          E2E_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:31017
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Print local-stack logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/alphaedge-api.log" || true
          cat "$RUNNER_TEMP/alphaedge-frontend.log" || true
      - name: Stop local stack
        if: always()
        shell: bash
        run: |
          for pid_file in "$RUNNER_TEMP/alphaedge-api.pid" "$RUNNER_TEMP/alphaedge-frontend.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" || true
            fi
          done
