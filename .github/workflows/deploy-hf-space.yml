name: Deploy Backend to HF Space

on:
  push:
    branches: [codex/alphaedge-base]
    paths: ["backend/**"]
  workflow_dispatch:
    inputs:
      sync_runtime_secrets:
        description: Sync GitHub Actions secrets into the HF Space before deploying
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required deploy secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN GitHub Actions secret is required to push to the Hugging Face Space."
            exit 1
          fi
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL GitHub Actions secret is required for the Hugging Face Space database."
            exit 1
          fi
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "ADMIN_API_KEY GitHub Actions secret is required for protected backend routes."
            exit 1
          fi

      - name: Sync runtime secrets to HF Space
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_runtime_secrets }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_SYNC: ${{ secrets.NEON_DATABASE_URL_SYNC }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.22"
          python3 << 'PY'
          import os
          import time

          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          SPACE_ID = "mukeshkumarkanda/alphaedge-api"

          def require(name: str) -> str:
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"{name} is required.")
              return value

          def to_async_pg_url(url: str) -> str:
              if url.startswith("postgresql+asyncpg://"):
                  return url
              if url.startswith("postgresql://"):
                  return url.replace("postgresql://", "postgresql+asyncpg://", 1)
              if url.startswith("postgres://"):
                  return url.replace("postgres://", "postgresql+asyncpg://", 1)
              raise SystemExit(
                  "NEON_DATABASE_URL must start with postgresql://, postgres://, "
                  "or postgresql+asyncpg://"
              )

          def to_sync_pg_url(url: str) -> str:
              if url.startswith("postgresql+asyncpg://"):
                  return url.replace("postgresql+asyncpg://", "postgresql://", 1)
              if url.startswith("postgres://"):
                  return url.replace("postgres://", "postgresql://", 1)
              if url.startswith("postgresql://"):
                  return url
              raise SystemExit(
                  "NEON_DATABASE_URL_SYNC must start with postgresql://, postgres://, "
                  "or postgresql+asyncpg://"
              )

          hf_token = require("HF_TOKEN")
          neon_database_url = require("NEON_DATABASE_URL")
          admin_api_key = require("ADMIN_API_KEY")
          neon_database_url_sync = os.environ.get("NEON_DATABASE_URL_SYNC", "").strip()

          database_url = to_async_pg_url(neon_database_url)
          database_url_sync = to_sync_pg_url(neon_database_url_sync or neon_database_url)

          api = HfApi()

          def add_space_secret_with_retry(key: str, value: str) -> None:
              secret_sync_deadline = time.monotonic() + 600
              attempt = 1
              while True:
                  try:
                      api.add_space_secret(
                          repo_id=SPACE_ID,
                          key=key,
                          value=value,
                          token=hf_token,
                      )
                      return
                  except HfHubHTTPError as error:
                      status_code = getattr(error.response, "status_code", None)
                      if status_code != 429 or time.monotonic() >= secret_sync_deadline:
                          raise
                      remaining = max(0, secret_sync_deadline - time.monotonic())
                      delay = min(60, attempt * 10, remaining)
                      print(
                          f"Retrying HF Space secret sync after 429 "
                          f"for {key} in {delay:.0f}s "
                          f"(attempt {attempt}, up to 10 minutes)"
                      )
                      time.sleep(delay)
                      attempt += 1

          for key, value in {
              "DATABASE_URL": database_url,
              "DATABASE_URL_SYNC": database_url_sync,
              "ADMIN_API_KEY": admin_api_key,
          }.items():
              add_space_secret_with_retry(key, value)

          print("Synced HF Space runtime secrets: DATABASE_URL, DATABASE_URL_SYNC, ADMIN_API_KEY")
          PY

      - name: Skip runtime secret sync
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sync_runtime_secrets) }}
        run: |
          echo "Skipping HF Space runtime secret sync; use workflow_dispatch with sync_runtime_secrets=true after rotating secrets."

      - name: Stage backend for HF Space
        run: |
          mkdir -p hf_stage
          cp -r backend/. hf_stage/
          # Replace standard Dockerfile with HF-specific one (port 7860, fixed env)
          cp hf_stage/Dockerfile.hfspace hf_stage/Dockerfile
          rm hf_stage/Dockerfile.hfspace
          # Write HF Space metadata header
          cat > hf_stage/README.md << 'HFEOF'
          ---
          title: AlphaEdge API
          emoji: 📈
          colorFrom: blue
          colorTo: green
          sdk: docker
          pinned: false
          app_port: 7860
          ---
          AlphaEdge paper-trading prediction market API.
          HFEOF

      - name: Push to HF Space
        id: push_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@alphaedge.app"
          git config --global user.name "AlphaEdge CI"

          retry_hf_git() {
            local label="$1"
            shift
            local deadline=$((SECONDS + 600))
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              local status=$?
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "ERROR: ${label} failed after retrying for up to 10 minutes."
                return "$status"
              fi
              local remaining=$((deadline - SECONDS))
              local delay=$((attempt * 10))
              if [ "$delay" -gt 60 ]; then
                delay=60
              fi
              if [ "$delay" -gt "$remaining" ]; then
                delay="$remaining"
              fi
              echo "Retrying ${label} in ${delay}s (attempt ${attempt}, up to 10 minutes)"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          rm -rf hf_space
          retry_hf_git "HF Space clone" \
            git clone "https://mukeshkumarkanda:${HF_TOKEN}@huggingface.co/spaces/mukeshkumarkanda/alphaedge-api" hf_space

          cd hf_space
          # Clear old content but preserve .git
          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete
          cp -r ../hf_stage/. .

          git add -A
          if git diff --cached --quiet; then
            echo "No changes - skipping push"
          else
            git commit -m "deploy: backend @ ${{ github.sha }}"
            retry_hf_git "HF Space push" git push
          fi

          space_sha=$(git rev-parse HEAD)
          echo "space_sha=$space_sha" >> "$GITHUB_OUTPUT"
          echo "HF Space target revision: $space_sha"

      - name: Wait for Space runtime revision
        env:
          SPACE_SHA: ${{ steps.push_space.outputs.space_sha }}
        run: |
          python3 << 'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          RUNTIME_URL = "https://huggingface.co/api/spaces/mukeshkumarkanda/alphaedge-api/runtime"
          space_sha = os.environ.get("SPACE_SHA", "").strip()
          if not space_sha:
              raise SystemExit("Expected pushed HF Space revision from previous step")

          deadline = time.monotonic() + 600
          attempt = 1
          while True:
              runtime: dict[str, object]
              try:
                  with urllib.request.urlopen(RUNTIME_URL, timeout=30) as response:
                      runtime = json.load(response)
              except (urllib.error.URLError, TimeoutError) as error:
                  runtime = {"stage": "REQUEST_FAILED", "errorMessage": str(error)}

              stage = runtime.get("stage")
              runtime_sha = runtime.get("sha")
              if runtime_sha == space_sha and stage == "RUNNING":
                  print(f"Space runtime is running the pushed revision {space_sha}")
                  raise SystemExit(0)
              if runtime_sha == space_sha and stage == "RUNTIME_ERROR":
                  raise SystemExit(
                      "HF Space runtime failed for pushed revision "
                      f"{space_sha}: {runtime.get('errorMessage')}"
                  )
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      "ERROR: HF Space runtime did not switch to pushed revision "
                      f"{space_sha} in time. Last stage={stage!r}, sha={runtime_sha!r}"
                  )

              print(
                  f"Attempt {attempt}/40: runtime stage={stage!r}, "
                  f"sha={runtime_sha!r}; waiting for {space_sha}"
              )
              attempt += 1
              time.sleep(15)
          PY

      - name: Wait for Space to become healthy
        run: |
          echo "Waiting for HF Space rebuild (up to 10 min)..."
          for i in $(seq 1 40); do
            body="$(mktemp)"
            status=$(curl --silent --show-error --location --output "$body" --write-out "%{http_code}" \
              https://mukeshkumarkanda-alphaedge-api.hf.space/health || echo 000)
            if [ "$status" = "200" ]; then
              echo "Space healthy after attempt $i"
              python3 - "$body" << 'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)

          if payload.get("status") != "ok":
              raise SystemExit(f"Expected health status 'ok', got {payload.get('status')!r}")
          if payload.get("paper_trading_only") is not True:
              raise SystemExit("Expected paper_trading_only=true from /health")

          print(json.dumps(payload, indent=2))
          PY
              exit 0
            fi
            echo "Attempt $i/40: HTTP $status - retrying in 15s"
            sleep 15
          done
          echo "ERROR: health check timed out; Space may still be building or failed to start."
          exit 1

      - name: Smoke-test markets endpoint
        run: |
          echo "Waiting for markets endpoint to return canonical market (up to 10 min)..."
          for i in $(seq 1 40); do
            body="$(mktemp)"
            status=$(curl --silent --show-error --location --output "$body" --write-out "%{http_code}" \
              https://mukeshkumarkanda-alphaedge-api.hf.space/api/v1/markets || echo 000)
            if [ "$status" = "200" ]; then
              if python3 - "$body" << 'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              markets = json.load(fh)

          if not any(market.get("slug") == "nba-2025-01-15-lal-bos" for market in markets):
              raise SystemExit("Canonical Lakers vs Celtics market was not returned")
          election = next(
              (market for market in markets if market.get("slug") == "elect-la-mayor-2026"),
              None,
          )
          if election is None:
              raise SystemExit("Los Angeles mayoral election market was not returned")
          if election.get("category") != "Politics":
              raise SystemExit("Expected Politics category on election market")

          print("/api/v1/markets returned 200 with canonical and election markets")
          PY
              then
                exit 0
              fi
            else
              echo "Attempt $i/40: /api/v1/markets HTTP $status - retrying in 15s"
              cat "$body"
            fi
            sleep 15
          done
          echo "ERROR: /api/v1/markets did not return the canonical market in time."
          exit 1

      - name: Smoke-test market snapshot endpoint
        run: |
          echo "Waiting for election snapshot endpoint (up to 10 min)..."
          for i in $(seq 1 40); do
            body="$(mktemp)"
            status=$(curl --silent --show-error --location --output "$body" --write-out "%{http_code}" \
              https://mukeshkumarkanda-alphaedge-api.hf.space/api/v1/markets/elect-la-mayor-2026/snapshot || echo 000)
            if [ "$status" = "200" ]; then
              if python3 - "$body" << 'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              snapshot = json.load(fh)

          market = snapshot.get("market") or {}
          if market.get("slug") != "elect-la-mayor-2026":
              raise SystemExit("Expected snapshot route to return the election market")
          if snapshot.get("paper_trading_only") is not True:
              raise SystemExit("Expected paper_trading_only=true from election snapshot")

          print("/api/v1/markets/elect-la-mayor-2026/snapshot returned 200")
          PY
              then
                exit 0
              fi
            else
              echo "Attempt $i/40: election snapshot HTTP $status - retrying in 15s"
              cat "$body"
            fi
            sleep 15
          done
          echo "ERROR: election snapshot endpoint did not return in time."
          exit 1

      - name: Smoke-test admin agent proof endpoint
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          echo "Waiting for admin agent proof endpoint (up to 10 min)..."
          for i in $(seq 1 40); do
            body="$(mktemp)"
            status=$(curl --silent --show-error --location --request POST --output "$body" --write-out "%{http_code}" \
              --header "X-Admin-API-Key: ${ADMIN_API_KEY}" \
              https://mukeshkumarkanda-alphaedge-api.hf.space/admin/agents/run/nba-2025-01-15-lal-bos || echo 000)
            if [ "$status" = "200" ]; then
              if python3 - "$body" << 'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              proof = json.load(fh)

          if proof.get("market_slug") != "nba-2025-01-15-lal-bos":
              raise SystemExit("Expected agent proof for canonical Lakers vs Celtics market")
          if "paper-trading simulation" not in str(proof.get("disclaimer", "")).lower():
              raise SystemExit("Expected paper-trading simulation disclaimer from agent proof")
          if proof.get("status") != "blocked" or proof.get("approved") is not False:
              raise SystemExit("Expected deployed agent proof to remain blocked by risk")

          steps = proof.get("steps") or []
          risk_step = next((step for step in steps if step.get("step_name") == "risk"), None)
          if risk_step is None:
              raise SystemExit("Expected risk step in deployed agent proof")
          risk_output = risk_step.get("output_data") or {}
          if risk_output.get("approved") is not False:
              raise SystemExit("Expected deployed risk step to reject weak edge")
          if not any("edge" in str(error).lower() for error in risk_output.get("errors", [])):
              raise SystemExit("Expected deployed risk step to report edge rejection")

          execute_step = next(
              (step for step in steps if step.get("step_name") == "execute"),
              None,
          )
          execute_output = json.dumps((execute_step or {}).get("output_data") or {})
          if "order_id" in execute_output or "execution_id" in execute_output:
              raise SystemExit("Deployed agent proof unexpectedly created execution artifacts")

          print("/admin/agents/run/nba-2025-01-15-lal-bos returned guarded proof")
          PY
              then
                exit 0
              fi
            else
              echo "Attempt $i/40: admin agent proof HTTP $status - retrying in 15s"
              cat "$body"
            fi
            sleep 15
          done
          echo "ERROR: admin agent proof endpoint did not return guarded proof in time."
          exit 1

      - name: Smoke-test paper order lifecycle
        run: |
          python3 << 'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE_URL = "https://mukeshkumarkanda-alphaedge-api.hf.space"
          MARKET_SLUG = "nba-2025-01-15-lal-bos"

          def request_json(method: str, path: str, payload: dict | None = None) -> tuple[int, dict]:
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  f"{BASE_URL}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body or "{}")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8")
                  try:
                      payload = json.loads(body or "{}")
                  except json.JSONDecodeError:
                      payload = {"detail": body}
                  return error.code, payload

          def cancel_order(account_id: str, order_id: str) -> None:
              for _ in range(3):
                  status, payload = request_json(
                      "POST",
                      f"/api/v1/orders/{order_id}/cancel",
                      {"account_id": account_id},
                  )
                  if status == 200 and payload.get("status") == "cancelled":
                      return
                  time.sleep(2)
              raise RuntimeError("Expected cancellation to release smoke-test order")

          def run_smoke() -> None:
              status, account = request_json("GET", "/api/v1/paper-account")
              if status != 200:
                  raise RuntimeError(f"/api/v1/paper-account returned HTTP {status}: {account}")
              if account.get("paper_trading_only") is not True:
                  raise RuntimeError("Expected paper account endpoint to report paper_trading_only=true")

              account_id = account["id"]
              order_id = ""
              try:
                  status, order = request_json(
                      "POST",
                      f"/api/v1/markets/{MARKET_SLUG}/orders",
                      {
                          "account_id": account_id,
                          "side": "buy",
                          "outcome": "yes",
                          "order_type": "limit",
                          "quantity": "1",
                          "price": "0.55",
                          "risk": {
                              "predicted_prob": 0.62,
                              "confidence": 0.8,
                              "edge": 0.07,
                              "current_drawdown": 0,
                              "minutes_before_start": 120,
                          },
                      },
                  )
                  if status != 200:
                      raise RuntimeError(f"paper order returned HTTP {status}: {order}")
                  order_id = order.get("id", "")
                  if order.get("status") != "open":
                      raise RuntimeError("Expected risk-gated paper order to open")
                  if order.get("market_id") is None or order.get("account_id") != account_id:
                      raise RuntimeError("Paper order did not bind to the smoke-test account")
              finally:
                  if order_id:
                      cancel_order(account_id, order_id)

              status, after_cancel = request_json("GET", "/api/v1/paper-account")
              if status != 200:
                  raise RuntimeError(f"post-cancel paper account returned HTTP {status}: {after_cancel}")
              if any(order.get("id") == order_id for order in after_cancel.get("open_orders", [])):
                  raise RuntimeError("Smoke paper order was not removed from open orders after cancel")

              print("Paper order lifecycle smoke opened and cancelled one risk-gated order")

          for attempt in range(1, 41):
              try:
                  run_smoke()
                  sys.exit(0)
              except Exception as error:
                  print(f"Attempt {attempt}/40: paper order lifecycle failed: {error}")
                  time.sleep(15)

          raise SystemExit("ERROR: paper order lifecycle smoke did not pass in time.")
          PY
