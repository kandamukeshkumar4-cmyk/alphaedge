name: Demo Uptime Watch

# Keeps the deployed demo warm and alerts (via workflow failure email) when it
# is down. Free-tier HF Spaces sleep after inactivity and Neon suspends idle
# compute — this cron both wakes them and proves the API answers before anyone
# opens the demo in front of an audience.
#
# Cron (hourly — COST-01: each run wakes the HF Space AND the Neon endpoint,
# so this cadence is a direct infra-burn dial): read-only production checks only
#   - scripts/verify_prod.py (checks 1-6) — failures fail the workflow
#   - no paper orders (journey order step stays off the schedule)
#
# workflow_dispatch: same read-only checks, plus optional full journey
#   (signup + paper order) when run_full_journey=true.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      run_full_journey:
        description: "Run full verify_journey.py including signup + paper order"
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_URL: https://mukeshkumar007-alphaedge-api.hf.space
  FRONTEND_URL: https://alphaedge-frontend-three.vercel.app

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Wake and verify /health (up to 5 min for cold start)
        run: |
          for i in $(seq 1 20); do
            body="$(mktemp)"
            status=$(curl --silent --show-error --location --max-time 30 \
              --output "$body" --write-out "%{http_code}" \
              "$BASE_URL/health" || echo 000)
            if [ "$status" = "200" ]; then
              echo "API healthy after attempt $i"
              python3 - "$body" << 'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload.get("status") == "ok", payload
          assert payload.get("paper_trading_only") is True, payload
          print(json.dumps(payload, indent=2))
          PY
              exit 0
            fi
            echo "Attempt $i/20: HTTP $status — retrying in 15s (Space may be waking)"
            sleep 15
          done
          echo "ERROR: demo API did not answer /health within 5 minutes."
          exit 1

      - name: Production verifier (checks 1-6)
        run: |
          python3 scripts/verify_prod.py \
            --api "$BASE_URL" \
            --frontend "$FRONTEND_URL"

      - name: Check AI analysis mode (warn-only)
        run: |
          body="$(mktemp)"
          status=$(curl --silent --show-error --location --max-time 30 \
            --output "$body" --write-out "%{http_code}" \
            "$BASE_URL/api/v1/briefs?limit=1" || echo 000)
          if [ "$status" != "200" ]; then
            echo "::warning::/api/v1/briefs returned HTTP $status — cannot check AI mode"
            exit 0
          fi
          python3 - "$body" << 'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          items = payload.get("items") or []
          if not items:
              print("::warning::No analyst briefs yet on the deployed demo")
          elif items[0].get("generator") != "llm":
              print(
                  "::warning::Latest analyst brief is generator="
                  f"{items[0].get('generator')!r} — the deployed backend has no "
                  "working LLM key. Run 'Deploy Backend to HF Space' with "
                  "sync_runtime_secrets=true after setting the LLM_* / NIM_API_KEY "
                  "GitHub secrets."
              )
          else:
              print("AI analysis is live (generator=llm)")
          PY

      - name: Full journey (manual/dispatch only — places a paper order)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_journey }}
        run: |
          python3 scripts/verify_journey.py --api "$BASE_URL"
