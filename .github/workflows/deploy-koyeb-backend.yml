name: Deploy Backend to Koyeb

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Expected public Koyeb API URL"
        required: true
        default: "https://alphaedge-api.koyeb.app"

permissions:
  contents: read

concurrency:
  group: deploy-koyeb-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy FastAPI backend
        shell: pwsh
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_SYNC: ${{ secrets.NEON_DATABASE_URL_SYNC }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          ./scripts/deploy_koyeb_neon.ps1

      - name: Verify backend health
        run: |
          curl --fail --show-error --silent "${{ inputs.api_url }}/health"
