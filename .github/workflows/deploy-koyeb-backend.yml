name: Deploy Backend to Koyeb

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Expected public Koyeb API URL"
        required: true
        default: "https://alphaedge-api.koyeb.app"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-koyeb-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy FastAPI backend
        shell: pwsh
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL_SYNC: ${{ secrets.NEON_DATABASE_URL_SYNC }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          ./scripts/deploy_koyeb_neon.ps1

      - name: Verify backend health
        run: |
          for i in {1..20}; do
            if curl --fail --show-error --silent "${{ inputs.api_url }}/health"; then
              exit 0
            fi
            echo "Backend not healthy yet; retry $i/20"
            sleep 15
          done
          exit 1

      - name: Rebuild Azure Static Web Apps frontend with backend URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run azure-static-web-apps-proud-meadow-01b42b810.yml \
            --ref "${{ github.ref_name }}" \
            --field api_url=${{ inputs.api_url }}
