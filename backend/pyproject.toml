[project]
name = "alphaedge"
version = "0.1.0"
description = "Paper-trading sports and election prediction market platform with real CLOB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "websockets>=15.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "python-multipart>=0.0.18",
    "joblib>=1.4.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "openai>=1.55.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
# Optional model-upgrade deps (T11). Not required for the default XGBoost path;
# install with `uv sync --extra ml-extra` in an environment that supports them.
ml-extra = [
    "lightgbm>=4.0",
    "shap>=0.44",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "httpx-ws>=0.6",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
