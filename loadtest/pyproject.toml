[project]
name = "alphaedge-loadtest"
version = "0.1.0"
description = "Loop V20 local load & performance baseline (never aims at production)"
requires-python = ">=3.11"
dependencies = [
  "locust>=2.29.0",
  "httpx>=0.27.0",
]

[project.scripts]
ae-load-boot = "scripts.boot_local_stack:main_cli"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
